name: Keep API awake

# Render's free tier spins the API down after 15 minutes of inactivity, and the
# cold boot costs ~40 seconds — long enough that a visitor thinks the site is
# broken. Pinging every 5 minutes keeps the instance resident.
#
# GitHub throttles scheduled workflows under load and can skip runs, so treat
# this as best-effort. For a hard guarantee add a second pinger on the same URL
# at uptimerobot.com or cron-job.org (both free, both more punctual than Actions).

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ vars.API_URL || 'https://nexus-neural-search.onrender.com' }}"
          # Generous max-time: a cold start legitimately takes ~40s.
          code=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 120 "$URL/")
          echo "HTTP $code"
          cat /tmp/body
          echo
          # 503 means the API is up but the search index is empty — worth failing
          # loudly so the run goes red instead of quietly passing.
          if [ "$code" = "503" ]; then
            echo "::error::API is up but the search index is empty or unreachable."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Unexpected status $code from $URL"
            exit 1
          fi
