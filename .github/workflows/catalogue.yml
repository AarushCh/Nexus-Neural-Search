name: Build catalogue

# Builds the whole catalogue on GitHub's runners and loads it straight into Neon.
# Nothing runs on your machine, and nothing needs your machine to be on.
#
# A runner gives 4 vCPU / 16 GB RAM / ~14 GB disk and a 6-hour job limit. A cold
# 100k build does not fit that in one go — the id pool is deliberately several
# times the target, because a global popularity ranking is nothing like this
# catalogue's shape — but `data/` is cached and every stage resumes, so a run
# that times out loses nothing. Dispatch it again and it carries on.
#
# Setup (once):
#   Settings > Secrets and variables > Actions > New repository secret
#     TMDB_API_KEY   your themoviedb.org v3 API key
#     DATABASE_URL   your Neon connection string (the pooled one is fine)
#
# Then: Actions > Build catalogue > Run workflow.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "How many titles to keep"
        required: true
        default: "100000"
      min_votes:
        description: "Minimum vote count (quality floor)"
        required: true
        default: "8"
      storage_budget_mb:
        description: "Stop loading at this many MB (Neon free branch is 512)"
        required: true
        default: "440"
      recreate:
        description: "Drop and rebuild the tables from scratch"
        type: boolean
        default: false
      stages:
        description: "Which stages to run"
        type: choice
        default: all
        options: [all, ids, fetch, normalise, index]
  schedule:
    # Weekly refresh. Re-runs normalise + index against the cached raw data, so
    # ratings and providers stay current without re-harvesting TMDB.
    - cron: "0 4 * * 0"

concurrency:
  # Two builds writing the same tables at once would interleave upserts.
  group: catalogue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # GitHub caps a job at 6 hours. A 50k build took 3h31m end to end, so a
    # 100k one does not comfortably fit in a single run — but `data/` is cached
    # with restore-keys and every stage is resumable, so a run that times out
    # loses nothing: dispatch again and it continues. To split it deliberately,
    # run with stages "ids-fetch" first and then "normalise-index".
    timeout-minutes: 350
    env:
      # Actions gives the job a pipe, not a tty, so Python block-buffers
      # stdout and the 4 KB buffer swallows every progress line until the
      # stage ends. A long fetch then looks identical to a hang.
      PYTHONUNBUFFERED: "1"
      # The API defaults this to 1 because ONNX gives every thread its own
      # memory arena and Render's free instance has 512 MB. A CI runner has
      # several cores and gigabytes, and embedding the catalogue is the slowest
      # stage by far, so let it use them — single-threaded embedding of 100k
      # documents would roughly double the longest job in the build.
      ONNX_THREADS: "4"
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TARGET: ${{ github.event.inputs.target || '100000' }}
      MIN_VOTES: ${{ github.event.inputs.min_votes || '8' }}
      STAGES: ${{ github.event.inputs.stages || 'normalise-index' }}
      # The load stops itself here rather than filling the branch: an over-quota
      # Neon database refuses writes, and that failure lands mid-build.
      STORAGE_BUDGET_MB: ${{ github.event.inputs.storage_budget_mb || '440' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Check secrets are set
        run: |
          test -n "$TMDB_API_KEY"  || { echo "::error::TMDB_API_KEY secret is not set"; exit 1; }
          test -n "$DATABASE_URL"  || { echo "::error::DATABASE_URL secret is not set"; exit 1; }

      - name: Install
        run: pip install -r requirements.txt

      # The raw TMDB responses are the expensive part (one request per title),
      # so they are cached between runs. A scheduled refresh then re-tags and
      # re-indexes for free instead of re-harvesting.
      - name: Restore harvested data
        uses: actions/cache@v4
        with:
          path: data
          key: catalogue-${{ env.TARGET }}-${{ github.run_id }}
          restore-keys: |
            catalogue-${{ env.TARGET }}-
            catalogue-

      - name: Free disk space
        # A 100k harvest writes a few GB; the runner ships with several GB of
        # preinstalled toolchains we do not need.
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Enumerate TMDB ids
        if: contains(env.STAGES, 'ids') || env.STAGES == 'all'
        run: python -m catalogue.build ids --target "$TARGET"

      - name: Fetch details
        if: contains(env.STAGES, 'fetch') || env.STAGES == 'all'
        run: python -m catalogue.build fetch --target "$TARGET" --workers 24

      - name: Normalise, tag and quality-gate
        if: contains(env.STAGES, 'normalise') || env.STAGES == 'all'
        run: python -m catalogue.build normalise --target "$TARGET" --min-votes "$MIN_VOTES"

      - name: Embed and index into Neon
        if: contains(env.STAGES, 'index') || env.STAGES == 'all'
        run: |
          python -m catalogue.build index \
            ${{ github.event.inputs.recreate == 'true' && '--recreate' || '' }}

      # The database is the live dataset, but the cache that backs it evicts
      # after a week of no hits. This leaves a downloadable copy on the run, so
      # a rebuild never has to re-download 50k titles from scratch.
      - name: Publish the dataset
        if: always() && hashFiles('data/catalogue.jsonl') != ''
        uses: actions/upload-artifact@v4
        with:
          name: catalogue
          path: data/catalogue.jsonl
          compression-level: 9
          retention-days: 90

      - name: Verify the live catalogue
        run: |
          python - <<'PY'
          from backend import store
          h = store.health()
          rep = store.storage_report()
          print(f"titles   {h['titles']}")
          print(f"storage  {rep['total_mb']} MB ({rep['bytes_per_title']/1024:.1f} KB/title)")
          assert h["ok"], f"catalogue unhealthy: {h}"
          PY

      - name: Summary
        if: always()
        run: |
          {
            echo "### Catalogue build"
            echo ""
            python - <<'PY'
          from backend import store
          h, rep = store.health(), store.storage_report()
          print(f"- titles: **{h['titles']:,}**")
          print(f"- storage: **{rep['total_mb']} MB** of a 512 MB branch "
                f"({rep['bytes_per_title']/1024:.1f} KB/title)")
          print(f"- of which: {rep['index_mb']} MB indexes, {rep['extra_mb']} MB detail blobs")
          print(f"- measured INDEX_OVERHEAD: {rep['index_overhead']} (set this for the next build)")
          print(f"- healthy: {h['ok']}")
          PY
          } >> "$GITHUB_STEP_SUMMARY"
